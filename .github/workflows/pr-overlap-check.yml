name: ci / PR overlap check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull-requests: write — post/update/delete comments on PRs
# (no issues: write needed — we only use the pulls comment API)
permissions:
  pull-requests: write

jobs:
  check-overlaps:
    name: Check PR file overlaps
    runs-on: ubuntu-latest
    # Skip bots — they open PRs programmatically and have their own process.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: return require('./.github/scripts/check-overlaps.js')({github, context, core})

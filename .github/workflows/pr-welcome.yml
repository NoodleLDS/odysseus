name: ci / welcome contributor

on:
  pull_request_target:
    types: [opened]   # opened only — welcome once per PR lifetime

# pull-requests: write — post a comment on the PR
permissions:
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributor
    runs-on: ubuntu-latest
    # Skip bots — they open PRs programmatically and have their own process.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: return require('./.github/scripts/welcome-contributor.js')({github, context, core})
